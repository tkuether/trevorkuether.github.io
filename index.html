<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trevor Kuether — Poetry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
body {
  margin: 0;
  padding: 0;
  font-family: Georgia, "Times New Roman", serif;
  background: #fdf8f3; /* warm white */
  color: #222;
  line-height: 1.6;
}

    header {
      text-align: center;
      padding: 40px 20px 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

        h3 {
      font-size: 2rem;
      margin-bottom: 2px;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: 1.2rem;
      color: #555;
      max-width: 600px;
      margin: 0 auto;
    }

    .poem-list {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .poem-list h2 {
      font-size: 1.6rem;
      margin-bottom: 14px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }

    .poem-list a {
      display: block;
      padding: 4px 0;
      font-size: 1.1rem;
      color: #333;
      text-decoration: none;
      border-bottom: 1px solid #e0ddd8;
      transition: color 0.2s ease;
    }

    .poem-list a:hover {
      color: #000;
    }

#poem-title {
  text-align: center;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 2.4rem;
  letter-spacing: 1px;
  margin-top: 40px;
  margin-bottom: 20px;
  color: #222;
}
    
#poem-container {
  text-align: center;
  margin: 40px auto;
  max-width: 600px;
  white-space: pre-wrap;
  font-family: Georgia, serif;
  font-size: 1.2rem;
  line-height: 1.8;
}
    
    footer {
      text-align: center;
      padding: 60px 20px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Trevor Kuether</h1>
    <p class="tagline">Ruminations of a Mind - Poetry</p>
  </header>

<h2 id="poem-title"></h2>
<div id="poem-container"></div>

<script>
  fetch('haiku/one.html')
    .then(response => response.text())
    .then(html => {
      const temp = document.createElement('div');
      temp.innerHTML = html;

      const title = temp.querySelector('.title');
      const poem = temp.querySelector('.poem');

      document.getElementById('poem-title').innerText = title.innerText;
      document.getElementById('poem-container').innerHTML = poem.innerHTML;
    });
</script>

  <section class="poem-list">
    <h2>Published Poems</h2>

    <!-- Add links to your poems here -->
    <a href="https://trevorkuether.substack.com/p/with-the-other?r=6wgxm">With the Other</a>
    <a href="poems/second-poem.html">Second Poem Title</a>
    <a href="poems/third-poem.html">Third Poem Title</a>

    <!-- You can add as many as you want -->
  </section>

  <footer>
    © 2026 Trevor Kuether — All Rights Reserved
  </footer>

</body>
</html>
